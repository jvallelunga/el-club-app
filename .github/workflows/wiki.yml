name: Publicar la ayuda en la wiki

on:
  push:
    branches: [main]
    paths: ["docs/usuario/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clonar la wiki
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git clone "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki

      - name: Copiar docs/usuario a la wiki
        run: rsync -a --delete --exclude .git docs/usuario/ wiki/

      - name: Publicar
        working-directory: wiki
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "La wiki ya está al día."
            exit 0
          fi
          git commit -m "Ayuda: ${GITHUB_SHA::7}"
          git push
